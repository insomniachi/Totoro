# Builds Totoro's installer (installer/build.ps1) and releases it, when run by hand (Actions → Installer → Run workflow).
# The version is the one given, or the last release's (its v* tag) with the patch number incremented; the project's
# version wins when it's higher (e.g. 2.0.0 after 1.7.x). The release gets a tag of it (v2.0.1) on the commit built.
name: Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 2.1.0. Leave empty for the last release's, with the patch number incremented.
        required: false
        default: ''

permissions:
  # To create the release and its tag.
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags, to find the last release.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: version
        shell: pwsh
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          $requested = $env:REQUESTED.Trim().TrimStart('v', 'V')
          if ($requested) {
            $parsed = $null
            if (-not [version]::TryParse($requested, [ref]$parsed) -or $parsed.Build -lt 0 -or $parsed.Revision -ge 0) {
              throw "'$env:REQUESTED' isn't a version like 2.1.0."
            }
            $version = $parsed
          } else {
            $last = git tag --list 'v*' |
              ForEach-Object { $v = $null; if ([version]::TryParse($_.Substring(1), [ref]$v)) { $v } } |
              Sort-Object -Descending | Select-Object -First 1
            $project = [version](([xml](Get-Content src/Totoro/Totoro.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
            $version = if ($last) { [version]::new($last.Major, $last.Minor, [Math]::Max($last.Build, 0) + 1) } else { $project }
            if ($project -gt $version) { $version = $project }
            Write-Host "Last release: $last; project: $project"
          }
          if (git tag --list "v$version") {
            throw "v$version is already released."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build the installer
        shell: pwsh
        run: ./installer/build.ps1 -Version '${{ steps.version.outputs.version }}'

      - uses: actions/upload-artifact@v7
        with:
          name: Totoro-${{ steps.version.outputs.version }}-setup-x64
          path: installer/output/*.exe
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: installer/output/*.exe
          generate_release_notes: true
