# Builds Totoro's installer (installer/build.ps1).
# - On pushes and pull requests: an installer to download from the run (its artifacts), versioned
#   <the project's version>.<run number>.
# - On a version tag (v2.1.0): the installer of that version, attached to a GitHub release of the tag.
name: Installer

on:
  push:
    branches: [next, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  # To create the release on a tag.
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $project = ([xml](Get-Content src/Totoro/Totoro.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $version = "$project.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build the installer
        shell: pwsh
        run: ./installer/build.ps1 -Version '${{ steps.version.outputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: Totoro-${{ steps.version.outputs.version }}-setup-x64
          path: installer/output/*.exe
          if-no-files-found: error

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/*.exe
          generate_release_notes: true
